name: Repo Guards

# Cheap file-reading guards over how the repository is wired, as opposed to
# `ui-guards.yml`, which guards the interface. Its own workflow because its
# trigger paths differ: `config/**` and its own script have to be in them —
# a guard a pull request can edit without re-running is not a guard.

on:
  pull_request:
    branches:
      - main
      - dev
      - dev-staging
      - release/*
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'config/**'
      - 'scripts/check-shared-source.mjs'
      - 'package.json'
      - '.github/workflows/repo-guards.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'config/**'
      - 'scripts/check-shared-source.mjs'
      - 'package.json'
      - '.github/workflows/repo-guards.yml'

permissions:
  contents: read

jobs:
  shared_package_source:
    name: Shared package source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads jest configs only — no dependencies, so no install step.
      - name: Check tests read the shared package's source
        run: npm run check:shared-source
