name: Presentation Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - 'skill/pptx/**'
      - 'bench/presentations/**'
      - '.github/workflows/presentation-review.yml'
  pull_request:
    paths:
      - 'skill/pptx/**'
      - 'bench/presentations/**'
      - '.github/workflows/presentation-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pptx-quality:
    name: Russian PPTX golden matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bench/presentations/requirements.txt

      - name: Install the office render toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libreoffice-impress \
            poppler-utils \
            fonts-dejavu-core \
            fonts-liberation

      - name: Install presentation dependencies
        run: python -m pip install --disable-pip-version-check -r bench/presentations/requirements.txt

      - name: Run presentation unit tests
        run: python -m unittest discover -s bench/presentations -p 'test_*.py'

      - name: Run the render-based golden matrix
        run: python bench/presentations/run_goldens.py --runs 3

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-quality-evidence
          path: |
            bench/presentations/results/matrix-summary.json
            bench/presentations/results/*/run-1/montage.png
            bench/presentations/results/*/run-1/*.artifact-report.json
          if-no-files-found: warn
          retention-days: 7
