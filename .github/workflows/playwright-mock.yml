name: Playwright E2E Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual e2e run'

permissions:
  contents: read

concurrency:
  group: playwright-mock-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=${{ secrets.NODE_MAX_OLD_SPACE_SIZE || 6144 }}'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  coverage-map:
    name: Coverage map guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Check that every claimed owning test exists
        run: node e2e/scripts/check-coverage-map.mjs

  e2e:
    runs-on: ubuntu-latest
    # The mock e2e suite runs serially within a job (workers:1, fullyParallel:false)
    # for backend/DB isolation. We run it as parallel shards so the whole suite
    # completes well under the per-job cap — the un-sharded suite exceeded 50 min and
    # was chronically cancelled on every PR (which also prevented its build caches
    # from ever saving, so every run rebuilt cold). Each shard is a self-contained
    # job (own build + backend + Mongo + mock); the per-shard timeout has headroom
    # for a cold-cache build so the run completes and warms the caches for next time.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_CHROMIUM_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
            packages/api/node_modules
            api/node_modules
          key: node-modules-e2e-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore data-provider build cache
        id: cache-data-provider
        uses: actions/cache@v4
        with:
          path: packages/data-provider/dist
          key: build-data-provider-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build data-provider
        if: steps.cache-data-provider.outputs.cache-hit != 'true'
        run: npm run build:data-provider

      - name: Restore data-schemas build cache
        id: cache-data-schemas
        uses: actions/cache@v4
        with:
          path: packages/data-schemas/dist
          key: build-data-schemas-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/data-schemas/src/**', 'packages/data-schemas/tsconfig*.json', 'packages/data-schemas/tsdown.config.mjs', 'packages/data-schemas/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build data-schemas
        if: steps.cache-data-schemas.outputs.cache-hit != 'true'
        run: npm run build:data-schemas

      - name: Restore api build cache
        id: cache-api
        uses: actions/cache@v4
        with:
          path: packages/api/dist
          key: build-api-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/api/src/**', 'packages/api/tsconfig*.json', 'packages/api/tsdown.config.mjs', 'packages/api/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json', 'packages/data-schemas/src/**', 'packages/data-schemas/tsconfig*.json', 'packages/data-schemas/tsdown.config.mjs', 'packages/data-schemas/package.json') }}

      - name: Build api
        if: steps.cache-api.outputs.cache-hit != 'true'
        run: npm run build:api

      - name: Restore client-package build cache
        id: cache-client-package
        uses: actions/cache@v4
        with:
          path: packages/client/dist
          key: build-client-package-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/client/src/**', 'packages/client/tsconfig*.json', 'packages/client/tsdown.config.mjs', 'packages/client/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build client-package
        if: steps.cache-client-package.outputs.cache-hit != 'true'
        run: npm run build:client-package

      - name: Restore client app build cache
        id: cache-client-app
        uses: actions/cache@v4
        with:
          path: client/dist
          key: build-client-app-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'client/src/**', 'client/public/**', 'client/scripts/post-build.cjs', 'client/index.html', 'client/package.json', 'client/vite.config.*', 'client/tsconfig*.json', 'client/tailwind.config.*', 'client/postcss.config.*', 'packages/client/src/**', 'packages/client/tsconfig*.json', 'packages/client/tsdown.config.mjs', 'packages/client/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build client app
        if: steps.cache-client-app.outputs.cache-hit != 'true'
        run: npm run build:client

      - name: Install Playwright runtime dependencies
        # Three attempts with a pause. The step downloads apt packages from Ubuntu
        # mirrors and has failed its five minutes three times on other people's
        # pull requests — the tests never ran, the artifacts were empty, and a
        # plain re-run went green. A retry removes the coin flip without hiding
        # anything: if the libraries genuinely cannot be installed, all three
        # attempts fail and so does the job.
        #
        # `continue-on-error` was the other candidate and was not taken. The
        # runner image ships Chrome's libraries already, so it would usually
        # work — but on the day it does not, the failure would surface as a
        # cryptic browser crash inside a test instead of here.
        timeout-minutes: 12
        run: |
          google-chrome --version
          for attempt in 1 2 3; do
            if npx playwright install-deps chrome; then
              exit 0
            fi
            echo "install-deps attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "install-deps failed three times — this is not a flake"
          exit 1

      - name: Run mock-LLM Tier-1 e2e (shard ${{ matrix.shard }}/4)
        # Cap the test step well under the job timeout (45m). A hung run then fails
        # THIS step — so the failure()/!cancelled() upload steps below still run and
        # capture artifacts — instead of running to the job timeout, which cancels
        # the job and drops everything. The suite finishes in ~2-3 min/shard, so 15m
        # is ample headroom over a legit (even cold-cache) run.
        timeout-minutes: 15
        # tee the runner output (which includes the mock webServer's piped stdout) to
        # a file so the server log survives as a downloadable artifact, not just inline
        # step logs. Write it to e2e/logs (NOT Playwright's outputDir, which is wiped at
        # the start of the run). pipefail keeps playwright's exit code authoritative.
        run: |
          set -o pipefail
          mkdir -p e2e/logs
          npx playwright test --config=e2e/playwright.config.mock.ts --shard=${{ matrix.shard }}/4 2>&1 \
            | tee "e2e/logs/run-shard-${{ matrix.shard }}.log"
        env:
          CI: 'true'

      - name: Run the permissions profile (shard 1 only)
        # A second hermetic run whose only difference is the `interface` block of
        # its config — the block that seeds role permissions at startup. It needs
        # its own server because permissions are decided once, at boot.
        #
        # A step on shard 1 rather than a job of its own: a job would repeat
        # ninety lines of cache-and-build for a run that takes forty seconds, and
        # this shard has already built everything. It costs shard 1 about a
        # minute and the gate as a whole nothing, since the shards run together.
        if: ${{ matrix.shard == 1 }}
        # Twenty, not ten: a genuinely failing test here retries twice and each
        # attempt carries a ninety-second budget, so ten minutes would cut the
        # run off and report "the step timed out" instead of the assertion that
        # failed.
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p e2e/logs
          npx playwright test --config=e2e/playwright.config.permissions.ts 2>&1 \
            | tee "e2e/logs/run-permissions.log"
        env:
          CI: 'true'

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          # Both reports: the permissions profile writes its own, and leaving it
          # out meant the one run whose failures are hardest to reproduce was
          # the one with no report to download.
          path: |
            e2e/playwright-report/**
            e2e/playwright-report-permissions/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces, screenshots & run log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: |
            e2e/specs/.test-results/**
            e2e/specs/.test-results-permissions/**
            e2e/logs/**
          retention-days: 7
          if-no-files-found: ignore

  aggregate:
    name: Mock e2e green
    # GitHub counts a SKIPPED required check as passed; this job runs on
    # always() and fails on any failed/cancelled/skipped need, so ONE required
    # check can cover the whole workflow. scripts/check-workflow-guards.mjs
    # keeps the needs list equal to the job list (inline form on purpose —
    # the dependency-free guard parser reads only the inline form).
    if: always()
    needs: [coverage-map, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail on any failed, cancelled or skipped job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          if printf '%s' "$NEEDS_JSON" | grep -qE '"result": ?"(failure|cancelled|skipped)"'; then
            exit 1
          fi
