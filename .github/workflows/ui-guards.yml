name: UI Guards

# Cheap file-reading guards over the interface: the icon canon and the
# translation strings. Its own workflow rather than jobs inside the lint one,
# because the paths that can break them include the guard scripts themselves —
# and a guard a pull request can edit without re-running is not a guard.
# `eslint-ci.yml` cannot simply gain these triggers: its other job reads
# `pull_request.base.sha`, which a push event does not carry.

on:
  pull_request:
    branches:
      - main
      - dev
      - dev-staging
      - release/*
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'scripts/check-icons.mjs'
      - 'scripts/check-i18n.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-guards.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'scripts/check-icons.mjs'
      - 'scripts/check-i18n.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-guards.yml'

jobs:
  icon_canon:
    name: Icon canon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check the icon canon
        run: npm run check:icons

  interface_strings:
    name: Interface strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check every UI string has a translation
        run: npm run check:i18n
