name: UI Guards

# Cheap file-reading guards over the interface: the icon canon, the layer
# scale, and the translation strings. Its own workflow rather than jobs inside the lint one,
# because the paths that can break them include the guard scripts themselves —
# and a guard a pull request can edit without re-running is not a guard.
# `eslint-ci.yml` cannot simply gain these triggers: its other job reads
# `pull_request.base.sha`, which a push event does not carry.

on:
  pull_request:
    branches:
      - main
      - dev
      - dev-staging
      - release/*
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'scripts/check-icons.mjs'
      - 'scripts/check-i18n.mjs'
      - 'scripts/check-layers.mjs'
      - 'scripts/check-tooltips.mjs'
      - 'scripts/check-panx.mjs'
      - 'scripts/check-temporary-tokens.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-guards.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'scripts/check-icons.mjs'
      - 'scripts/check-i18n.mjs'
      - 'scripts/check-layers.mjs'
      - 'scripts/check-tooltips.mjs'
      - 'scripts/check-panx.mjs'
      - 'scripts/check-temporary-tokens.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-guards.yml'

jobs:
  icon_canon:
    name: Icon canon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check the icon canon
        run: npm run check:icons

  interface_strings:
    name: Interface strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check every UI string has a translation
        run: npm run check:i18n

  layer_canon:
    name: Layer canon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check the layer canon
        run: npm run check:layers

  shadow_canon:
    name: Shadow canon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check the shadow canon
        run: npm run check:shadows

  focus_canon:
    name: Focus canon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check the focus canon
        run: npm run check:focus

  artifacts_offline:
    name: Artifacts stay offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check the artifact preview has no third party
        run: npm run check:artifacts-offline

  pdfjs_assets:
    name: PDF decoders are vendored
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Presence is checked without an install; the byte comparison against the
      # installed package needs one, and the backend suite already does it.
      - name: Check the vendored pdf.js decoders
        run: npm run check:pdfjs-assets

  tooltip_canon:
    name: Tooltip canon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check controls use the ink plate, not the native title balloon
        run: npm run check:tooltips

  sideways_pan_canon:
    name: Sideways-pan canon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check every horizontal scroller contains its overscroll
        run: npm run check:panx

  temporary_inversion:
    name: Temporary-chat inversion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # Reads files only — no dependencies, so no install step.
      - name: Check every composer token is remapped for the temporary chat
        run: npm run check:temporary

  aggregate:
    name: All UI guards green
    # GitHub counts a SKIPPED required check as passed; this job runs on
    # always() and fails on any failed/cancelled/skipped need, so ONE required
    # check can cover the whole workflow. scripts/check-workflow-guards.mjs
    # keeps the needs list equal to the job list (inline form on purpose —
    # the dependency-free guard parser reads only the inline form).
    if: always()
    needs: [icon_canon, interface_strings, layer_canon, shadow_canon, focus_canon, artifacts_offline, pdfjs_assets, tooltip_canon, sideways_pan_canon, temporary_inversion]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail on any failed, cancelled or skipped job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          if printf '%s' "$NEEDS_JSON" | grep -qE '"result": ?"(failure|cancelled|skipped)"'; then
            exit 1
          fi
