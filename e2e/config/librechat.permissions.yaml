# Credential-free e2e config for the PERMISSIONS profile. Identical to
# librechat.e2e.yaml except for the `interface` block below, which is what seeds
# role permissions at startup (packages/api/src/app/permissions.ts).
#
# This exists because the gate cannot be tested any other way in this fork:
# self-service registration always creates a plain USER (AuthService.js), so no
# test can hand itself the MANAGE_ROLES capability, and roles are cached
# server-side, so writing to Mongo behind the server's back changes nothing.
# The honest lever is the config the operator actually edits.
version: 1.3.11
cache: true

interface:
  contextCost: true

  # OFF: each of these seeds a role permission, and each has one affordance in
  # the interface that must disappear with it.
  prompts: false
  multiConvo: false
  temporaryChat: false

  # ON, deliberately: without something left switched on, a run where the whole
  # permission system failed to load would look exactly like a run where every
  # gate worked.
  bookmarks: true
  agents: true

mcpServers:
  e2e-memory:
    type: stdio
    command: node
    args:
      - e2e/setup/fake-mcp-server.js
    title: E2E Memory
    description: Local MCP fixture used by mock end-to-end tests.
    timeout: 30000

endpoints:
  custom:
    - name: 'Mock Provider A'
      apiKey: 'e2e-mock-key-a'
      baseURL: 'http://127.0.0.1:8889/v1'
      models:
        default:
          - 'mock-model-a'
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'Mock Provider A'
      customParams:
        defaultParamsEndpoint: anthropic

    - name: 'Mock Provider B'
      apiKey: 'e2e-mock-key-b'
      baseURL: 'http://127.0.0.1:8889/v1'
      models:
        default:
          - 'mock-model-b'
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'Mock Provider B'

    # No model spec mirrors this endpoint's label, so it stays unambiguous in the
    # selector and gives e2e tests a real ephemeral endpoint → model option.
    - name: 'Mock Provider C'
      apiKey: 'e2e-mock-key-c'
      baseURL: 'http://127.0.0.1:8889/v1'
      models:
        default:
          - 'mock-model-c'
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'Mock Provider C'

    # Second non-spec endpoint so e2e tests can switch between two real
    # ephemeral endpoints (e.g. MCP selection persistence across switches).
    - name: 'Mock Provider D'
      apiKey: 'e2e-mock-key-d'
      baseURL: 'http://127.0.0.1:8889/v1'
      models:
        default:
          - 'mock-model-d'
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'Mock Provider D'

modelSpecs:
  prioritize: true
  # Enforcement would reject sends from the non-spec paths addedEndpoints
  # exposes below (buildEndpointOption requires a spec when enforce is true).
  enforce: false
  # Surfaces the endpoints menu (modelSelect defaults on when addedEndpoints is
  # set) limited to entries that don't collide with the spec labels above.
  addedEndpoints:
    - 'Mock Provider C'
    - 'Mock Provider D'
    - 'agents'
  list:
    - name: 'e2e-mock-provider-a'
      label: 'Mock Provider A'
      preset:
        endpoint: 'Mock Provider A'
        model: 'mock-model-a'

    - name: 'e2e-mock-provider-b'
      label: 'Mock Provider B'
      preset:
        endpoint: 'Mock Provider B'
        model: 'mock-model-b'

    - name: 'e2e-icon-spec'
      label: 'E2E Icon Spec'
      iconURL: '/assets/openai.svg'
      preset:
        endpoint: 'Mock Provider A'
        model: 'mock-model-a'

    - name: 'e2e-skill-scope'
      label: 'E2E Skill Scope'
      preset:
        endpoint: 'Mock Provider A'
        model: 'mock-model-a'
      skills:
        - 'e2e-model-spec-allowed'
        - 'e2e-model-spec-missing'
        - 'e2e-model-spec-inaccessible'

    - name: 'e2e-soft-default'
      label: 'E2E Soft Default'
      softDefault: true
      preset:
        endpoint: 'Mock Provider A'
        model: 'mock-model-a'

    - name: 'e2e-branded'
      label: 'E2E Branded'
      description: '<strong>Branded</strong> answers <img src="/assets/openai.svg" alt="brand icon">'
      showOnLanding: true
      preset:
        endpoint: 'Mock Provider A'
        model: 'mock-model-a'

    - name: 'e2e-starters'
      label: 'E2E Starters'
      conversation_starters:
        - 'E2E_REPLY:starter'
        - 'Plan my week'
        - 'Third starter prompt'
        - 'Fourth starter prompt'
        - 'Fifth starter beyond the cap'
      preset:
        endpoint: 'Mock Provider A'
        model: 'mock-model-a'
